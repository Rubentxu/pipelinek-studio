[versions]
kotlin = "2.1.0"
ktor = "3.0.1"
junit5 = "5.11.3"
assertj = "3.26.3"
mockk = "1.13.13"
xerial = "3.46.1.3"
flyway = "10.10.0"
logback = "1.5.12"
coroutines = "1.10.1"
cliKt = "5.0.0"
detekt = "1.23.8"
pipelinek = "0.48.0-rc1"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit5" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-test = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }
xerial-sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "xerial" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
cliKt = { module = "com.github.ajalt.clikt:clikt", version.ref = "cliKt" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
# PipelineK SDK — pinned to prerelease v0.48.0-rc1 "SDK S6 consumible desde fuera" (2026-10-09).
# Coordinate shown is the declared consumption vector; S0 pins the SHA artifact.
pipelinek-app = { module = "dev.pipelinek:pipeline-kotlin-application", version.ref = "pipelinek" }

[bundles]
junit5 = ["junit-jupiter", "junit-jupiter-params", "assertj-core", "mockk"]
ktor-server = [
    "ktor-server-core",
    "ktor-server-netty",
    "ktor-server-content-negotiation",
    "ktor-serialization-kotlinx-json",
    "ktor-server-status-pages",
    "ktor-server-call-logging",
    "ktor-server-sse",
]
storage = ["xerial-sqlite-jdbc", "flyway-core"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
application = { id = "application" }
