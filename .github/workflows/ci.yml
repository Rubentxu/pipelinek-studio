name: ci

# Per-PR fast feedback: run the unit tests + detekt + a
# quick subset of the UAT scripts. The full from-clean-clone
# harness lives in release-harness.yml and runs on every push
# to main (and on PRs as a separate check). This split keeps
# PR feedback under 5 minutes while still gating main with
# the full release verdict.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      # `io.jenkins.pipelinek.fabric:*` is only published to a developer's local Maven
      # repo. A clean runner cannot resolve it, and Gradle fails while building the task
      # graph, so a single `./gradlew test` (even with `--continue`) runs ZERO tests.
      # `:studio-infra-fabric` is therefore isolated in its own step and every other
      # module keeps producing real signal. Only that module may be listed as excluded.
      - name: Check every Studio module is classified for CI
        run: |
          set -euo pipefail
          listed="studio-domain studio-application studio-http studio-infra-podman studio-infra-sdk studio-infra-storage studio-cli studio-app studio-build-logic"
          excluded="studio-infra-fabric"
          unclassified=$(comm -23 \
            <(grep -oE '\"studio-[a-z-]+\"' settings.gradle.kts | tr -d '\"' | sort -u) \
            <(printf '%s\n%s\n' $listed $excluded | sort -u))
          if [ -n "$unclassified" ]; then
            echo "::error::New Studio module(s) not classified for CI: $(echo $unclassified). Add them to this workflow."
            exit 1
          fi

      - name: Run unit tests
        run: >-
          ./gradlew --no-daemon
          :studio-domain:test :studio-application:test :studio-http:test
          :studio-infra-podman:test :studio-infra-sdk:test
          :studio-infra-storage:test :studio-cli:test :studio-app:test

      # Stays red on purpose: it is a blocker report, not a passing run. A green job here
      # would hide the missing published contracts instead of naming them.
      - name: Fabric contract module (blocked until Fabric publishes its contracts)
        id: fabric-module
        continue-on-error: true
        run: ./gradlew --no-daemon :studio-infra-fabric:test

      - name: Report the unpublished-contract blocker
        if: steps.fabric-module.outcome != 'success'
        run: |
          echo "::error title=BLOCKED: unpublished Fabric contracts::studio-infra-fabric needs io.jenkins.pipelinek.fabric:{model,run-control,observation}:0.5.0-R1-alpha.8, which only exists in a developer mavenLocal() until Fabric publishes its contracts to a remote repository. Every other module ran and reported above."
          {
            echo "### ⛔ BLOCKED — Fabric contracts are not published"
            echo "All other Studio modules ran their tests above. Only \`:studio-infra-fabric\`"
            echo "cannot start, so this job is red on purpose: not a passing run, not a Studio"
            echo "regression. Resolve it in the Fabric repository by publishing"
            echo '`io.jenkins.pipelinek.fabric:*` to a remote Maven channel.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # R0.1.3 (2026-10-11): a real `detekt` Gradle task now exists
  # at the root project (see build.gradle.kts). The job runs
  # it with the default posture (DETEKT_FAIL_ON_FINDINGS=1)
  # so a finding causes a red check — the legacy baseline
  # posture is no longer the implicit default in CI.
  detekt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Run detekt
        run: ./gradlew --no-daemon detekt

  # R0.1.4 + C0.2 (2026-10-12): lint and typecheck for the
  # Node-side apps. Previously apps/{mcp,web,vscode} had no
  # real lint ('echo lint deferred to S1' as a script) and
  # typecheck that emitted files ('tsc -b --pretty'). Both
  # fixed; this job runs the real commands across the three
  # apps. C0.2 also pins the cache key to the per-app
  # package-lock.json so setup-node never falls back to a
  # non-existent root lockfile (the bug the mandate called
  # out).
  apps-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: apps/mcp ci
        working-directory: apps/mcp
        run: npm ci --cache .npm --prefer-offline
      - name: apps/mcp lint
        working-directory: apps/mcp
        run: npm run lint
      - name: apps/mcp typecheck
        working-directory: apps/mcp
        run: npm run typecheck
      - name: apps/mcp test
        working-directory: apps/mcp
        run: npm test
      - name: apps/web ci
        working-directory: apps/web
        run: npm ci --cache .npm --prefer-offline
      - name: apps/web lint
        working-directory: apps/web
        run: npm run lint
      - name: apps/web typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: apps/web test
        working-directory: apps/web
        run: npm test
      - name: apps/vscode ci
        working-directory: apps/vscode
        run: npm ci --cache .npm --prefer-offline
      - name: apps/vscode lint
        working-directory: apps/vscode
        run: npm run lint
      - name: apps/vscode typecheck
        working-directory: apps/vscode
        run: npm run typecheck
      - name: apps/vscode test
        working-directory: apps/vscode
        run: npm test
