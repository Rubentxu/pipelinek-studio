name: ci

# Per-PR fast feedback: run the unit tests + detekt + a
# quick subset of the UAT scripts. The full from-clean-clone
# harness lives in release-harness.yml and runs on every push
# to main (and on PRs as a separate check). This split keeps
# PR feedback under 5 minutes while still gating main with
# the full release verdict.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Run unit tests
        run: ./gradlew --no-daemon test

  # R0.1.3 (2026-10-11): a real `detekt` Gradle task now exists
  # at the root project (see build.gradle.kts). The job runs
  # it with the default posture (DETEKT_FAIL_ON_FINDINGS=1)
  # so a finding causes a red check — the legacy baseline
  # posture is no longer the implicit default in CI.
  detekt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Run detekt
        run: ./gradlew --no-daemon detekt

  # R0.1.4 (2026-10-11): lint and typecheck for the Node-side
  # apps. Previously apps/{mcp,web,vscode} had no real lint
  # ('echo lint deferred to S1' as a script) and typecheck
  # that emitted files ('tsc -b --pretty'). Both fixed; this
  # job runs the real commands across the three apps.
  apps-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: apps/mcp lint
        working-directory: apps/mcp
        run: npm ci && npm run lint
      - name: apps/mcp typecheck
        working-directory: apps/mcp
        run: npm run typecheck
      - name: apps/web lint
        working-directory: apps/web
        run: npm ci && npm run lint
      - name: apps/web typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: apps/vscode typecheck
        working-directory: apps/vscode
        run: npm ci && npm run typecheck
      - name: apps/vscode lint
        working-directory: apps/vscode
        run: npm run lint
