name: release-harness

# Audit R-16 (2026-10-10): the studio previously had no
# automated gate on PRs. AAT-REL-007 documented this as
# "no GH Actions substitute" — the release verdict was
# produced only by the studio's own tests, which certifies
# the source but NOT the artifact.
#
# This workflow is the closest we can get to an external
# release harness using GitHub's free CI:
#  - Triggers on every push to main and every PR
#  - Runs the from-clean-clone harness in a fresh checkout
#  - Surfaces the verdict (READY / READY_WITH_RISKS /
#    NOT_READY) on the PR or commit status
#  - A future S5 hardening pass can wire an additional
#    runner (separate GitHub org, separate runner pool)
#    to provide the "external" component the ROADMAP DoD
#    mentions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Node 20 (for apps/mcp smoke)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run from-clean-clone harness
        id: harness
        run: |
          set -uo pipefail
          bash scripts/verify-from-clean-clone.sh 2>&1 | tee /tmp/harness.log
        continue-on-error: true

      - name: Classify verdict
        if: always()
        run: |
          if [ "${{ steps.harness.conclusion }}" = "success" ]; then
            # B0.4 (2026-10-10): a green `conclusion` is no
            # longer sufficient. The harness now prints a stable
            # `HARNESS_SUMMARY passed=N expected=M HARNESS_OK`
            # line on success; we assert it is present and that
            # N == M. A success with a missing or partial
            # summary indicates a trap-bypass regression and
            # downgrades the verdict to NOT_READY.
            if grep -E '^HARNESS_SUMMARY passed=[0-9]+ expected=[0-9]+ HARNESS_OK$' /tmp/harness.log >/tmp/harness-summary.txt 2>/dev/null; then
              SUMMARY="$(cat /tmp/harness-summary.txt)"
              echo "## ✅ READY" >> "$GITHUB_STEP_SUMMARY"
              echo "All harness steps passed. ${SUMMARY}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "## ❌ NOT_READY" >> "$GITHUB_STEP_SUMMARY"
              echo "Harness exited 0 but did not emit a clean HARNESS_SUMMARY line. Possible regression in the on_exit trap or summary helper." >> "$GITHUB_STEP_SUMMARY"
              tail -n 20 /tmp/harness.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
              exit 1
            fi
          else
            # B0.2 (2026-10-10): the previous classifier split
            # non-zero exits into "❌ NOT_READY" (when the log
            # contained a ❌ marker) and "⚠️ READY_WITH_RISKS"
            # (when it did not). READY_WITH_RISKS is a soft
            # verdict — it tells the reviewer "something failed
            # but the marker was missing", which is exactly the
            # false-positive channel B0 exists to close. A
            # non-zero harness exit is a hard failure; classify
            # every such case as NOT_READY. The ❌ marker is no
            # longer load-bearing; it remains as a debug aid but
            # the verdict no longer depends on the failure-mode
            # being textual.
            echo "## ❌ NOT_READY" >> "$GITHUB_STEP_SUMMARY"
            echo "Harness exited non-zero. See /tmp/harness.log." >> "$GITHUB_STEP_SUMMARY"
            # Surface the last 20 lines of the harness log so the
            # reviewer can see what actually failed without
            # downloading the artifact.
            tail -n 20 /tmp/harness.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload harness log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-log
          path: /tmp/harness.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail the workflow if harness failed
        if: steps.harness.conclusion != 'success'
        run: |
          echo "::error::release harness did not pass; see $GITHUB_STEP_SUMMARY"
          exit 1
