# PipelineK Studio — Gradle properties
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1g
# Reproducible
org.gradle.dependency.verification=off
# Studio deps pin
pipelinek.version=0.48.0-rc1
pipelinek.artifact=dev.pipelinek:pipeline-kotlin-application:0.48.0-rc1

# B0 follow-up (R-VER-001): single source of truth for the Studio
# version. Read by the root build.gradle.kts (project.version),
# studio-cli/build.gradle.kts (studioVersionB51 + standalone tar),
# studio-http/src/main/.../Json.kt (VersionResponse default), and
# pinned by studio-cli/src/test/.../VersionCoherenceB0Test. When you
# cut a new release, bump this property AND the same string in:
#   - apps/web/package.json  (SPA version)
#   - apps/mcp/package.json  (MCP adapter version)
#   - apps/vscode/package.json  (VS Code extension version)
#   - contracts/openapi.yaml (info.version)
#   - studio-infra-sdk/src/main/resources/sdk.lock.json (studio_release)
#   - studio-cli/src/main/kotlin/dev/pipelinek/studio/cli/Version.kt (const val)
# The VersionCoherenceB0Test fails CI if any of these diverge.
studio.version=1.0.0-rc.14

# JVM target stable across toolchain
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
