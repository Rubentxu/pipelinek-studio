openapi: 3.1.0
info:
  title: PipelineK Studio HTTP API
  version: 1.0.0
  description: >-
    Contractual surface for Studio. Routes declared here MUST match the
    actual `StudioHttpModule.install(this)` declarations in
    `studio-http/src/main/kotlin/dev/pipelinek/studio/http/StudioHttpModule.kt`.

    R0.2.6 (2026-10-11): the `/api/v1` path prefix was removed. The actual
    server has always mounted routes at `/experiments`, `/runs`, etc.
    (no prefix). The previous `/api/v1` prefix in this document was a
    stale contract — no production client (CLI / Web / MCP) ever used
    it. The CLI's `StudioHttpClient` calls `/api/version` (special
    path), and the SDK generator (`studio generate-sdk-ts`) reads from
    `StudioHttpModule.current`, not from this file. Keeping the prefix
    would have made the contract diverge from the wire surface for no
    reason.

    R0.6 sync (2026-10-17): the route set declared in this document is
    now the StudioHttpModule surface. The previously-tracked
    `/runs/{runId}/operations/{operationId}/output` route was a stale
    operation-scoped path; the canonical route is
    `/runs/{runId}/output` and is what the wire serves. The set of
    routes now matches the served `OpenApiDoc.kt` document with one
    source-of-truth caveat: this file is the curated surface for
    external consumers and `OpenApiDoc.kt` is the runtime-served
    summary at `GET /openapi.json`. Both must stay aligned; a
    regression test (`OpenApiDocPathParityTest`) asserts the path set
    parity on every build.

    Deferred to follow-up commits: routes from sibling route files
    (`PluginAdmissionRoutes`, `ScheduleRunRoutes`, `RecoveryRoutes`,
    `LiveEventRoutes`, `TreeEventRoutes`). Those route families have
    their own bounded contracts and are added to this document in
    subsequent commits to keep the diff size auditable.

    Schemas in `components/schemas` are illustrative; the wire DTOs in
    `studio-http/src/main/kotlin/dev/pipelinek/studio/http/Json.kt`
    are authoritative. Per docs/02-specifications/HTTP_AND_STREAMING_API.md,
    breaking changes require a v2 route prefix.
servers:
  - url: http://127.0.0.1:8765
    description: Illustrative local endpoint; bind to configured loopback port.
paths:
  /:
    get:
      operationId: discover
      summary: Discover currently available authorized operations
      responses:
        '200':
          description: Root representation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RootResponse' }
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Ready and versioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /experiments:
    post:
      operationId: createExperiment
      security: [{ LocalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExperiment' }
      responses:
        '201':
          description: Experiment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Experiment' }
        '400': { $ref: '#/components/responses/Error' }
    get:
      operationId: listExperiments
      summary: >-
        Collection read backing the VS Code tree bootstrap. The SSE
        stream is a live tail, not a journal, so an authoritative
        initial/reconnect snapshot comes from this read. Newest first.
      security: [{ LocalSession: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Experiment collection (newest first)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [experiment_id, name, created_at]
                      properties:
                        experiment_id: { type: string }
                        name: { type: string }
                        created_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /experiments/{experimentId}/snapshots:
    post:
      operationId: createSnapshot
      security: [{ LocalSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSnapshot' }
      responses:
        '201':
          description: Immutable source snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        '400': { $ref: '#/components/responses/Error' }
    get:
      operationId: listExperimentSnapshots
      summary: >-
        Collection read of one experiment's snapshots, newest first.
        Pairs with GET /experiments for the authoritative VS Code tree
        snapshot; the experimentId path parameter is the canonical id.
      security: [{ LocalSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Snapshot collection (newest first)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [snapshot_id, experiment_id, sha256, created_at]
                      properties:
                        snapshot_id: { type: string }
                        experiment_id: { type: string }
                        sha256: { type: string }
                        created_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /snapshots/{snapshotId}:
    get:
      operationId: getSnapshot
      security: [{ LocalSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      responses:
        '200':
          description: Immutable snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        '404': { $ref: '#/components/responses/Error' }
  /runs:
    post:
      operationId: startRun
      summary: Admit and schedule a run; operation is idempotent within scope
      security: [{ LocalSession: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartRun' }
      responses:
        '202':
          description: Accepted run, not necessarily executed
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /runs/{runId}:
    get:
      operationId: getRun
      security: [{ LocalSession: [] }]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run projection with source of state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '404': { $ref: '#/components/responses/Error' }
  /runs/{runId}/cancel:
    post:
      operationId: requestCancel
      summary: Request cancellation; return does not imply terminal CANCELLED
      security: [{ LocalSession: [] }]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '202':
          description: Cancellation requested or already requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '409': { $ref: '#/components/responses/Error' }
  /runs/{runId}/events:
    get:
      operationId: readEvents
      security: [{ LocalSession: [] }]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - { in: query, name: after, required: false, schema: { type: string }, description: Event Plane cursor ONLY }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200':
          description: Event page or typed refusal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '409': { $ref: '#/components/responses/Error' }
  /runs/{runId}/operations/{operationId}/output:
    get:
      deprecated: true
      summary: DEPRECATED — operation-scoped path that was never wired; remove from clients
      description: >-
        This path is the legacy operation-scoped route declared by an older
        S2 spec. The actual server mounts `/runs/{runId}/output` directly
        (no `operationId` segment). Marked `deprecated` here so SDK generators
        and human readers can detect it; the wire returns 404 for it.
      parameters:
        - $ref: '#/components/parameters/RunId'
        - { in: path, name: operationId, required: true, schema: { type: string } }
      responses:
        '404':
          description: Path not wired; use `/runs/{runId}/output`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /runs/{runId}/output:
    get:
      operationId: readOutput
      security: [{ LocalSession: [] }]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - { in: query, name: after, required: false, schema: { type: string }, description: Output Plane cursor ONLY }
        - { in: query, name: maxBytes, required: false, schema: { type: integer, minimum: 1, maximum: 65536, default: 65536 } }
      responses:
        '200':
          description: Bounded output page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutputPage' }
        '409': { $ref: '#/components/responses/Error' }
  /runs/{runId}/diagnostics:
    get:
      operationId: readDiagnostics
      security: [{ LocalSession: [] }]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Normalized diagnostics for the run (B3 wire shape)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnosticsDto' }
        '503':
          description: DIAGNOSTICS_UNAVAILABLE — diagnostic port did not produce a snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /runs/{runId}/ir:
    get:
      operationId: readIr
      security: [{ LocalSession: [] }]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: IR projection with COMPILED/ADMITTED/OBSERVED phases
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IrResultDto' }
        '503':
          description: IR_UNAVAILABLE — IR provider refused (e.g. compile-only upstream unsupported)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /runs/{runId}/stream:
    get:
      operationId: sseRunEvents
      summary: Server-Sent Events push of run events (R5 EVO-C.0 surface)
      security: [{ LocalSession: [] }]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - { in: query, name: lastId, required: false, schema: { type: string }, description: "Last event id the client has; server emits `: missed` then resumes" }
      responses:
        '200':
          description: text/event-stream with experiment.created/deleted, run.started/step.changed/completed, snapshot.created
          content:
            text/event-stream:
              schema: { type: string }
        '501':
          description: NOT_WIRED — the server has no bus bound (honest polling fallback)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/version:
    get:
      operationId: apiVersion
      security: [{ LocalSession: [] }]
      responses:
        '200':
          description: Studio version + PipelineK runtime provenance (B5.4 cert surface)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
  /api/metrics:
    get:
      operationId: apiMetrics
      summary: JVM-level visibility for cold vs steady-state profiling (S5)
      security: [{ LocalSession: [] }]
      responses:
        '200':
          description: JVM metrics document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsResponse' }
  /api/static-analyze-capability:
    get:
      operationId: staticAnalyzeCapability
      summary: B3.3 — whether static analysis is available (Detekt etc.) and the toolchain provenance
      security: [{ LocalSession: [] }]
      responses:
        '200':
          description: Capability document with `available` flag + `reason` or `analyzer_version`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaticAnalyzeCapabilityDto' }
  /api/admin/lease:
    post:
      operationId: adminLease
      summary: AAT-SEC-010 — issue a workspace lease for a destructive op
      security: [{ LocalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaseRequest' }
      responses:
        '201':
          description: Lease issued (token + ttl)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaseDto' }
        '400': { $ref: '#/components/responses/Error' }
  /api/admin/retention:
    post:
      operationId: adminRetention
      summary: AAT-DUR-006 — run retention sweep; report kept/deleted runs
      security: [{ LocalSession: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionRequest' }
      responses:
        '200':
          description: Retention report (scanned + deleted + kept reasons)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionReportDto' }
        '400': { $ref: '#/components/responses/Error' }
  /api/admin/recovery:
    post:
      operationId: adminRecovery
      summary: SFW-H4.6 — server-side restart reconciliation (in-flight run bindings)
      security: [{ LocalSession: [] }]
      requestBody:
        required: false
      responses:
        '200':
          description: Recovery report (all bindings recovered)
        '207':
          description: Partial recovery (some bindings failed)
        '501': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/runs/schedule:
    post:
      operationId: runsSchedule
      summary: SFW-H5.4 — schedule a run against the capacity port (placement_audit)
      security: [{ LocalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleRunRequest' }
      responses:
        '200': { description: Worker placed (workerId + region) }
        '202': { description: Unknown (accepted, will be retried) }
        '501': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /events:
    get:
      operationId: treeEventsSse
      summary: R5 EVO-C.0 — SSE stream of tree events (experiments/runs/snapshots)
      security: [{ LocalSession: [] }]
      responses:
        '200':
          description: text/event-stream of tree events
          content:
            text/event-stream: {}
        '501': { $ref: '#/components/responses/Error' }
  /api/recovery:
    get:
      operationId: apiRecovery
      summary: S5 server-side restart reconciliation report (in-flight runs after restart)
      security: [{ LocalSession: [] }]
      responses:
        '200':
          description: Recovery entries (RECOVERY_REQUIRED / LOST) per run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryReportDto' }
  /openapi.json:
    get:
      operationId: openapiJson
      summary: This document, served at runtime (the canonical `OpenApiDoc.current` in OpenApiDoc.kt)
      security: [{ LocalSession: [] }]
      responses:
        '200':
          description: OpenAPI 3.1 JSON
          content:
            application/json:
              schema: { type: object }
  /scenarios:
    post:
      operationId: registerScenario
      summary: R0.3.1 — register a Scenario (the canonical scenario id source)
      security: [{ LocalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterScenarioRequest' }
      responses:
        '201':
          description: Registered scenario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterScenarioResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409':
          description: Version conflict (same id, different version)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflictDto' }
    get:
      operationId: listScenarios
      summary: List scenarios (collection read)
      security: [{ LocalSession: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Scenario collection (newest first)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListScenariosResponse' }
        '400': { $ref: '#/components/responses/Error' }
  /steps:
    get:
      operationId: listSteps
      summary: S2 — Step plugin catalog (admitted + DISCOVERED + REFUSED)
      security: [{ LocalSession: [] }]
      responses:
        '200':
          description: Step catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepCatalogDto' }
  /steps/{stepId}:
    get:
      operationId: describeStep
      security: [{ LocalSession: [] }]
      parameters:
        - { in: path, name: stepId, required: true, schema: { type: string } }
      responses:
        '200':
          description: Single step contract
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepContractDto' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    LocalSession:
      type: apiKey
      in: header
      name: X-Studio-Local-Token
      description: Illustrative local credential. S0 must select secure browser/CSRF implementation; never ship hardcoded tokens.
  parameters:
    ExperimentId: { in: path, name: experimentId, required: true, schema: { type: string } }
    SnapshotId: { in: path, name: snapshotId, required: true, schema: { type: string } }
    RunId: { in: path, name: runId, required: true, schema: { type: string } }
  responses:
    Error:
      description: Typed error, not an empty success
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    RootResponse:
      type: object
      required: [schema, studioVersion, links, actions]
      properties:
        schema: { type: string, const: 'studio.pipelinek.dev/api/v1' }
        studioVersion: { type: string }
        links: { type: array, items: { $ref: '#/components/schemas/Action' } }
        actions: { type: array, items: { $ref: '#/components/schemas/Action' } }
    Action:
      type: object
      required: [rel, method, href]
      properties:
        rel: { type: string }
        method: { type: string, enum: [GET, POST, PUT, DELETE] }
        href: { type: string }
    Health:
      type: object
      required: [status, studioVersion]
      properties:
        status: { type: string, enum: [READY, DEGRADED, NOT_READY] }
        studioVersion: { type: string }
        runtimeVersion: { type: [string, 'null'] }
        blockedCapabilities: { type: array, items: { type: string } }
    CreateExperiment:
      type: object
      required: [title, workspaceRef]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        workspaceRef: { type: string }
    Experiment:
      type: object
      required: [experimentId, title, workspaceRef]
      properties:
        experimentId: { type: string }
        title: { type: string }
        workspaceRef: { type: string }
    CreateSnapshot:
      type: object
      required: [sourceUtf8]
      additionalProperties: false
      properties:
        sourceUtf8: { type: string, maxLength: 1048576 }
    Snapshot:
      type: object
      required: [snapshotId, experimentId, sha256, sourceUtf8]
      properties:
        snapshotId: { type: string }
        experimentId: { type: string }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        sourceUtf8: { type: string }
        createdAt: { type: string, format: date-time }
    StartRun:
      type: object
      required: [snapshotId, scenarioId, executionProfileId]
      additionalProperties: false
      properties:
        snapshotId: { type: string }
        scenarioId: { type: string }
        executionProfileId: { type: string }
    Run:
      type: object
      required: [runId, snapshotId, scenarioId, state, runtimeVersion, actions]
      properties:
        runId: { type: string }
        snapshotId: { type: string }
        scenarioId: { type: string }
        state:
          type: string
          enum: [CREATED, ADMITTED, QUEUED, STARTING, RUNNING, CANCEL_REQUESTED, SUCCEEDED, FAILED, CANCELLED, REFUSED, RECOVERY_REQUIRED, LOST, UNKNOWN]
        runtimeVersion: { type: string }
        upstreamRunId: { type: [string, 'null'] }
        actions: { type: array, items: { $ref: '#/components/schemas/Action' } }
        reason: { type: [string, 'null'] }
    EventPage:
      type: object
      required: [runId, items, terminal]
      properties:
        runId: { type: string }
        items: { type: array, items: { type: object, additionalProperties: true } }
        nextEventCursor: { type: [string, 'null'] }
        terminal: { type: boolean }
    OutputPage:
      type: object
      required: [runId, operationId, contentBase64, contentEncoding, terminal]
      properties:
        runId: { type: string }
        operationId: { type: string }
        contentBase64: { type: string, contentEncoding: base64 }
        contentEncoding: { type: string, const: base64 }
        nextOutputCursor: { type: [string, 'null'] }
        terminal: { type: boolean }
    ApiError:
      type: object
      required: [schema, code, phase, message, retryable]
      properties:
        schema: { type: string, const: 'studio.pipelinek.dev/error/v1' }
        requestId: { type: string }
        code: { type: string }
        phase: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        details: { type: object, additionalProperties: true }
        actions: { type: array, items: { $ref: '#/components/schemas/Action' } }
    VersionResponse:
      type: object
      required: [studio]
      properties:
        studio: { type: string }
        pipelinek_runtime: { type: string }
        pipelinek_runtime_digest: { type: string }
        pipelinek_runtime_capabilities: { type: array, items: { type: string } }
        pipelinek_runtime_source: { type: string, enum: [manifest, lockfile-sha, none] }
    MetricsResponse:
      type: object
      required: [jvm]
      properties:
        jvm: { $ref: '#/components/schemas/JvmMetrics' }
    JvmMetrics:
      type: object
      required: [uptime_ms, threads_live, threads_peak, heap_used_mb, heap_max_mb, available_processors]
      properties:
        uptime_ms: { type: integer, format: int64 }
        threads_live: { type: integer }
        threads_peak: { type: integer }
        heap_used_mb: { type: integer, format: int64 }
        heap_max_mb: { type: integer, format: int64 }
        available_processors: { type: integer }
    StaticAnalyzeCapabilityDto:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        reason: { type: string }
        analyzer_version: { type: string }
        analyzer_digest: { type: string }
        ruleset_version: { type: string }
    LeaseRequest:
      type: object
      required: [op_kind]
      properties:
        op_kind: { type: string, enum: [plugin-revoke, retention-sweep, schema-migrate] }
        ttl_seconds: { type: integer, minimum: 30, maximum: 3600, default: 300 }
    LeaseDto:
      type: object
      required: [token, op_kind, issued_at, expires_at]
      properties:
        token: { type: string }
        op_kind: { type: string }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    RetentionRequest:
      type: object
      properties:
        older_than_seconds: { type: integer, minimum: 60 }
        terminal_only: { type: boolean, default: true }
    RetentionReportDto:
      type: object
      required: [runsScanned, runsDeleted]
      properties:
        runsScanned: { type: integer }
        runsDeleted: { type: integer }
        runsKept:
          type: array
          items: { $ref: '#/components/schemas/RetentionKeptDto' }
    RetentionKeptDto:
      type: object
      required: [runId, reason]
      properties:
        runId: { type: string }
        reason: { type: string }
        pid: { type: integer, format: int64 }
        detail: { type: string }
    RecoveryReportDto:
      type: object
      required: [controlRoot, totalRuns]
      properties:
        controlRoot: { type: string }
        totalRuns: { type: integer }
        reconciled:
          type: array
          items: { $ref: '#/components/schemas/RecoveryEntryDto' }
    RecoveryEntryDto:
      type: object
      required: [runId, state, reason]
      properties:
        runId: { type: string }
        state: { type: string, enum: [RECOVERY_REQUIRED, LOST, RUNNING, CANCELLED, OK] }
        lastEventKind: { type: string }
        lastEventAt: { type: string, format: date-time }
        reason: { type: string }
    RegisterScenarioRequest:
      type: object
      properties:
        scenario_id: { type: string }
        version: { type: integer, minimum: 1 }
        plugin_lock_digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        environment_profile: { type: string }
    RegisterScenarioResponse:
      type: object
      required: [scenario_id, version, environment_profile, created_at]
      properties:
        scenario_id: { type: string }
        version: { type: integer }
        plugin_lock_digest: { type: string }
        environment_profile: { type: string }
        created_at: { type: string, format: date-time }
    VersionConflictDto:
      type: object
      required: [code, existing_version, attempted_version]
      properties:
        code: { type: string, enum: [VERSION_CONFLICT] }
        existing_version: { type: integer }
        attempted_version: { type: integer }
    ListScenariosResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ScenarioSummaryDto' }
    ScenarioSummaryDto:
      type: object
      required: [scenario_id, version, environment_profile, created_at]
      properties:
        scenario_id: { type: string }
        version: { type: integer }
        plugin_lock_digest: { type: string }
        environment_profile: { type: string }
        created_at: { type: string, format: date-time }
    StepContractDto:
      type: object
      required: [id, name, capabilities]
      properties:
        id: { type: string }
        name: { type: string }
        plugin_jar: { type: string }
        capabilities: { type: array, items: { type: string } }
        input_schema_present: { type: boolean }
        output_schema_present: { type: boolean }
        affordances:
          type: array
          items: { $ref: '#/components/schemas/StepAffordanceDto' }
        provenance: { $ref: '#/components/schemas/StepProvenanceDto' }
        refusal_reason: { type: string }
    StepAffordanceDto:
      type: object
      required: [kind, label]
      properties:
        kind: { type: string }
        label: { type: string }
    StepProvenanceDto:
      type: object
      required: [plugin_jar, discovery]
      properties:
        plugin_jar: { type: string }
        vendor: { type: string }
        sdk_version_range: { type: string }
        discovery: { type: string, enum: [ServiceLoader, SdkRegistry, Builtin] }
    StepCatalogDto:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          items: { $ref: '#/components/schemas/StepContractDto' }
    DiagnosticsDto:
      type: object
      required: [diagnostics]
      properties:
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/DiagnosticDto' }
    DiagnosticDto:
      type: object
      required: [id, severity, phase, message, source]
      properties:
        id: { type: string }
        severity: { type: string, enum: [ERROR, WARNING, INFO] }
        phase: { type: string, enum: [COMPILATION, DSL_CONSTRUCTION, ADMISSION, EXECUTION] }
        message: { type: string }
        source: { type: string }
        line: { type: integer }
        column: { type: integer }
        path: { type: string }
        run_id: { type: string }
        actions:
          type: array
          items: { type: string }
        toolchain_version: { type: string }
        toolchain_digest: { type: string }
    IrResultDto:
      type: object
      properties:
        snapshot: { $ref: '#/components/schemas/IrDto' }
        reason: { type: string }
    IrDto:
      type: object
      required: [run_id, stages, phases_observed]
      properties:
        run_id: { type: string }
        stages:
          type: array
          items: { $ref: '#/components/schemas/StageIrDto' }
        phases_observed:
          type: array
          items: { type: string, enum: [COMPILED, ADMITTED, OBSERVED] }
    StageIrDto:
      type: object
      required: [name, steps]
      properties:
        name: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/StepIrDto' }
    StepIrDto:
      type: object
      required: [op_id, name, class_name, capabilities, phase]
      properties:
        op_id: { type: string }
        name: { type: string }
        class_name: { type: string }
        capabilities:
          type: array
          items: { type: string }
        input_schema_present: { type: boolean }
        output_schema_present: { type: boolean }
        phase: { type: string, enum: [COMPILED, ADMITTED, OBSERVED] }
